# Worker "panela": API em /api/* + app React (Vite) servido como Static Assets.
name = "panela"
main = "worker/index.ts"
compatibility_date = "2026-10-29"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# Recomendado: remover daqui e usar `npx wrangler secret put ADMIN_PASSWORD`.
ADMIN_PASSWORD = "admin123"

[[kv_namespaces]]
binding = "cha_panela_kv"
id = "9046bb899f3040e3bb487b117902b60b"
